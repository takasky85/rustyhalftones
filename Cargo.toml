[package]
name = "rustyhalftones"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Halftone separation tool for screen printing (egui + wgpu)"

[dependencies]
# egui on the wgpu renderer. Keep eframe's default features: they pull in egui-wgpu/default,
# which is what enables wgpu's native backends (DX12 on Windows, Metal on macOS). Turning
# defaults off leaves only Vulkan and the window fails to open on machines without it.
eframe = { version = "0.32", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "tiff", "bmp", "webp", "gif",
] }
rfd = "0.15"
flate2 = "1"
# Only used to wait on wgpu error scopes while building the preview pipeline.
pollster = "0.4"

[features]
# Headless GPU vs CPU comparison tests (they need a GPU or software adapter).
gpu-tests = []

# The halftone loops are painfully slow at opt-level 0.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
