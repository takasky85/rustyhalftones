name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: rustyhalftones.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: GPU shader tests
        # Renders on a software adapter and compares with the CPU renderer. Informational.
        continue-on-error: true
        run: cargo test --release --features gpu-tests gpu -- --nocapture --test-threads=1
      - name: Build
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" dist/
          cp README.md dist/
          cd dist
          7z a "../rustyhalftones-${{ matrix.name }}.zip" . > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: rustyhalftones-${{ matrix.name }}
          path: rustyhalftones-${{ matrix.name }}.*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" --generate-notes
